{% extends 'base.html' %}

{% block content %}

<!-- Main Content -->
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
  <div class="row justify-content-center w-100">
    <div class="col-md-6 col-lg-4">
      
      <div class="card shadow p-4 border-0 text-dark" style="background-color: rgb(255, 255, 255);">
        <h2 class="text-center mb-4 fw-bold">Welcome Back!</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
          </div>
          <div class="text-center mt-4">
            <button class="btn btn-primary w-50 fw-semibold" type="submit" style="font-size: 18px;">
              Login
            </button>
          </div>
        </form>

        <!-- Signup Link -->
        <p class="text-center mt-4 mb-0">
          Don’t have an account? 
          <a href="{{ url_for('signup') }}" class="text-decoration-none fw-semibold text-info" style="color:#0d6efd !important">
            Sign up here
          </a>
        </p>
      </div>

    </div>
  </div>
</div>

{% endblock %}
