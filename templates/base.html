<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Health Monitoring</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">

</head>
<body class="{% if is_homepage %}home-page{% else %}with-navbar-padding{% endif %}">

    <!-- Navbar -->
    <nav class="navbar sticky-top navbar-expand-lg">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- Left: Nav Links -->
            <div class="d-flex">
                <a class="nav-link ms-4" href="/home">Home</a>
            </div>

            <!-- Center: Logo -->
            <a class="navbar-brand mx-auto logo position-absolute start-50 translate-middle-x" href="/home">
                <img src="/static/images/favicon.png" alt="Heart Health Monitoring Logo" width="50">
            </a>

            <!-- Right: User Icon -->
            <div class="d-flex align-items-center">
                <a href="/user">
                    <i class="fa-solid fa-user fa-2xl"></i>
                </a>
            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="content-wrapper">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <div class="f-info">
            <div class="f-info-socials">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-square-instagram"></i>
                <i class="fa-brands fa-linkedin"></i>
            </div>
            <div class="f-info-brand">&copy;Heart Health Monitoring Private Limited</div>
            <div class="f-info-links">
                <a href="/privacy">Privacy</a>&nbsp;
                <a href="/terms">Terms</a>
            </div>
        </div>
    </footer>

    <!-- Scroll JS for home page navbar -->
    <script>
        const navbar = document.querySelector('.navbar');

        if (document.body.classList.contains('home-page')) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > window.innerHeight / 2) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>
</html>
