{% extends 'user.html' %}

{% block account_content %}

<style>
    
    #gridOverlay {
    position: absolute;
    width: 200%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(0,255,0,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,0,0.15) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 4s linear infinite;
    z-index: 0;
    }
    
    @keyframes moveGrid {
        from { transform: translateX(0); }
        to { transform: translateX(-40px); }
    }
    
    #singleBeatChart {
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 0 6px #00ffcc);
    }
    
    #cursor {
        position: absolute;
        right: 10px;
        top: 0;
        width: 3px;
        height: 100%;
        background: linear-gradient(to bottom, transparent, #00ffcc, transparent);
        box-shadow: 0 0 10px #00ffcc;
        animation: blink 1s infinite;
        z-index: 2;
    }
    
    @keyframes blink {
        0%, 50%, 100% { opacity: 1; }
        25%, 75% { opacity: 0.2; }
    }
</style>

<div class="container mt-4">
  <h2 class="mb-4">ECG / Arrhythmia Detection</h2>

  <!-- SINGLE BEAT -->
  <div class="card p-4 mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">
      Single Beat
    </div>
    <div class="card-body">

      <div class="mb-3">
        <input type="file" id="ecgFile" class="form-control" accept=".csv,.txt,.npy,.jpg,.jpeg,.png">
      </div>

      <button class="btn btn-primary" onclick="uploadFile()">Analyze</button>

      <div class="mt-3">
          <button id="prevBtn" class="btn btn-secondary" onclick="prevBeat()" style="display:none;">
            ← Previous
          </button>
      
          <button id="nextBtn" class="btn btn-secondary" onclick="nextBeat()" style="display:none;">
            Next →
          </button>
      </div>

      <div id="jumpContainer" class="mt-3" style="display:none;">
          <input type="number" id="beatIndex" class="form-control d-inline-block" style="width:150px;" placeholder="Enter beat #" min="1">
          <button class="btn btn-primary" onclick="jumpBeat()">Go</button>
      </div>

      <div id="singleBeatPanel" style="display:none;" class="mt-4">
        <h5>Prediction</h5>
        <div id="singleBeatMeta"></div>

        <div id="singleDiagnosisAlert" class="alert mt-2" style="display:none;"></div>

        <div class="mt-3">
          <label>Waveform Scale:</label>
          <input type="range" id="scaleSlider" min="2" max="20" value="10" 
                 oninput="updateScale(this.value)">
          <span id="scaleValue">10</span>
        </div>

        <div id="monitorContainer" style="
            position: relative;
            background: black;
            border-radius: 10px;
            padding: 10px;
            overflow: hidden;
        ">

            <!-- Moving Grid -->
            <div id="gridOverlay"></div>

            <!-- ECG Canvas -->
            <canvas id="singleBeatChart" height="100"></canvas>

            <!-- Blinking Cursor -->
            <div id="cursor"></div>

        </div>
        <div id="recommendationBox" class="mt-3"></div>

        <p style="font-size:12px; color:gray;">
        ⚠️ This is an AI-assisted analysis and not a medical diagnosis. Please consult a doctor.
        </p>

        <!-- 🔥 DOWNLOAD BUTTON -->
        <a id="downloadBtn" class="btn btn-dark mt-2" style="display:none;">
            Download Report PDF
        </a>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const labelMap = {
    0: "Normal ❤️",
    1: "Supraventricular ⚠️",
    2: "Ventricular (PVC) 🚨",
    3: "Fusion ⚠️",
    4: "Unknown ❓"
};
let chart = null;
let ecgInterval = null;
let yRange = 10;  // default scale

async function nextBeat() {

    let res = await fetch("/api/next_beat");

    if (!res.ok) {
        alert("Server error");
        return;
    }

    let data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    updateUI(data);
}

async function prevBeat() {

    let res = await fetch("/api/prev_beat");

    if (!res.ok) {
        alert("Server error");
        return;
    }

    let data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    updateUI(data);
}

async function jumpBeat() {

    let indexInput = document.getElementById("beatIndex").value;

    if (!indexInput) {
        alert("Enter a beat number");
        return;
    }

    let index = parseInt(indexInput) - 1; // convert to 0-based

    let res = await fetch("/api/jump_beat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ index: index })
    });

    if (!res.ok) {
        alert("Server error");
        return;
    }

    let data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    updateUI(data);
}

function updateScale(val) {
    yRange = parseInt(val);
    document.getElementById("scaleValue").innerText = val;
}

function updateUI(data) {

    const labelMap = {
        0: "Normal ❤️",
        1: "Supraventricular ⚠️",
        2: "Ventricular (PVC) 🚨",
        3: "Fusion ⚠️",
        4: "Unknown ❓"
    };

    let labelName = labelMap[data.pred_class] || "Unknown";
    let confidence = Math.max(...data.probs).toFixed(3);

    document.getElementById("singleBeatPanel").style.display = "block";

    document.getElementById("singleBeatMeta").innerHTML =
        `<strong>Predicted:</strong> ${labelName} <br>
         <strong>Confidence:</strong> ${confidence} <br>
         <small>Beat ${data.index + 1} / ${data.total}</small>`;

    let isNormal = data.pred_class == 0;

    let alertBox = document.getElementById("singleDiagnosisAlert");
    alertBox.style.display = "block";
    alertBox.className = "alert alert-" + (isNormal ? "success" : "danger");
    alertBox.innerHTML = isNormal ? "Normal ❤️" : "Arrhythmia Detected ⚠️";

    startLiveECG(data.waveform, data.pred_class);
    document.getElementById("beatIndex").value = data.index + 1;
    showRecommendation(data.recommendation);
    // 🔥 SHOW DOWNLOAD BUTTON
    if (data.report_id) {
        const btn = document.getElementById("downloadBtn");
        btn.style.display = "inline-block";
        btn.href = `/download/report/${data.report_id}`;
    }
}

async function uploadFile() {
    // 🔥 Hide old download button
    document.getElementById("downloadBtn").style.display = "none";

    let fileInput = document.getElementById("ecgFile");

    if (!fileInput.files.length) {
        alert("Please upload an ECG file");
        return;
    }

    let formData = new FormData();
    formData.append("file", fileInput.files[0]);

    let res = await fetch("/api/upload_file", {
        method: "POST",
        body: formData
    });

    if (!res.ok) {
        alert("Server error");
        return;
    }

    let data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    // 🔥 Show / Hide Next button
    if (data.mode === "multi") {
        document.getElementById("nextBtn").style.display = "inline-block";
        document.getElementById("prevBtn").style.display = "inline-block";
        document.getElementById("jumpContainer").style.display = "block";
    } else {
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("prevBtn").style.display = "none";
        document.getElementById("jumpContainer").style.display = "none";
    }

    document.getElementById("singleBeatPanel").style.display = "block";

    // 🔥 Reset old graph
    if (ecgInterval) clearInterval(ecgInterval);
    if (chart) chart.destroy();

    // ✅ Update UI
    updateUI(data);

    document.getElementById("beatIndex").max = data.total;
    document.getElementById("beatIndex").min = 1;
}

function startLiveECG(waveform, label) {

    if (ecgInterval) clearInterval(ecgInterval);
    if (chart) chart.destroy();

    let lineColor = (label == 0) ? "#00ffcc" : "#ff3b3b";

    Chart.defaults.elements.line.borderJoinStyle = 'round';
    Chart.defaults.elements.line.capBezierPoints = true;
    chart = new Chart(document.getElementById("singleBeatChart"), {
        type: "line",
        data: {
            labels: [],
            datasets: [{
                data: [],
                borderWidth: 2,
                borderColor: lineColor,
                pointRadius: 0,
                tension: 0.3,
                segment: {
                    borderColor: ctx => lineColor
                }
            }]
        },
        options: {
            responsive: true,
            animation: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: {
                    display: false,
                    grid: {
                        color: "rgba(255,255,255,0.1)"
                    },
                    ticks: {
                        color: "white"
                    }
                },
                y: {
                    min: -yRange/2,
                    max: yRange/2,
                    grid: {
                        color: "rgba(255,255,255,0.1)"
                    },
                    ticks: {
                        color: "white"
                    }
                }
            }
        }
    });

    let index = 0;
    let windowSize = 50;

    ecgInterval = setInterval(() => {

        if (index >= waveform.length) index = 0;

        chart.data.labels.push(index);
        chart.data.datasets[0].data.push(waveform[index]);

        if (chart.data.labels.length > windowSize) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }

        chart.options.scales.y.min = -yRange / 2;
        chart.options.scales.y.max = yRange / 2;
        chart.update();

        index++;

    }, 50);
}

// ---------------- PREDICT ----------------
async function uploadSingleBeat() {

    let input = document.getElementById("singleBeatPaste").value;

    if (!input) {
        alert("Please provide ECG input");
        return;
    }

    let res = await fetch("/api/predict_beat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ samples: input })
    });

    let data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    document.getElementById("singleBeatPanel").style.display = "block";

    let confidence = data.confidence 
    ? data.confidence.toFixed(3) 
    : Math.max(...data.probs).toFixed(3);

    // ✅ Show prediction + actual label
    document.getElementById("singleBeatMeta").innerHTML =
        `<strong>Predicted:</strong> ${labelName} <br>
         <strong>Confidence:</strong> ${confidence}`;

    // ✅ Diagnosis (5-class safe)
    let diagText = "Normal ❤️";
    let diagType = "success";

    if (data.label !== "Normal") {
        diagText = "Arrhythmia Detected ⚠️";
        diagType = "danger";
    }

    let alertBox = document.getElementById("singleDiagnosisAlert");
    alertBox.style.display = "block";
    alertBox.className = "alert alert-" + diagType;
    alertBox.innerHTML = diagText;

    // ✅ Plot waveform (LIVE MODE)
    let waveform = data.waveform;

    // clear old animation if exists
    if (ecgInterval) clearInterval(ecgInterval);

    if (chart) chart.destroy();

    // initialize empty chart
    chart = new Chart(document.getElementById("singleBeatChart"), {
        type: "line",
        data: {
            labels: [],
            datasets: [{
                label: "ECG Signal",
                data: [],
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            animation: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: { display: false },
                y: { min: -6, max: 6 } // adjust if needed
            }
        }
    });

    // animate left → right
    let index = 0;
    let windowSize = 50; // visible points

    ecgInterval = setInterval(() => {

        if (index >= waveform.length) {
            index = 0; // 🔁 loop continuously (remove if you want one-time)
        }

        chart.data.labels.push(index);
        chart.data.datasets[0].data.push(waveform[index]);

        // scrolling effect
        if (chart.data.labels.length > windowSize) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }

        chart.update();

        index++;

    }, 50); // speed (lower = faster)
    }

function showRecommendation(data) {
    const box = document.getElementById("recommendationBox");

    if (!data) return;

    const adviceList = data.advice.map(a => `<li>${a}</li>`).join("");

    let color = "green";
    if (data.risk === "MODERATE") color = "orange";
    if (data.risk === "HIGH") color = "red";

    box.innerHTML = `
        <h5>🧠 AI Recommendation</h5>
        <p><strong>Risk Level:</strong> ${data.risk}</p>
        <p>${data.message}</p>
        <ul>${adviceList}</ul>
    `;

    box.style.border = `2px solid ${color}`;
    box.style.padding = "10px";
    box.style.borderRadius = "8px";
    box.style.boxShadow = `0 0 5px ${color}`;
}

</script>

{% endblock %}
